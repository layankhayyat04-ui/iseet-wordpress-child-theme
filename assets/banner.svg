<svg width="1000" height="220" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#1B2A45"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="accentW" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#21759B"/>
      <stop offset="50%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="220" fill="url(#bgW)"/>
  <rect y="0" width="1000" height="6" fill="url(#accentW)"/>
  <rect y="214" width="1000" height="6" fill="url(#accentW)"/>

  <g opacity="0.18">
    <circle cx="60" cy="40" r="1.6" fill="#00D9FF"/>
    <circle cx="120" cy="80" r="1.6" fill="#8B5CF6"/>
    <circle cx="900" cy="50" r="1.6" fill="#00D9FF"/>
    <circle cx="940" cy="180" r="1.6" fill="#8B5CF6"/>
    <circle cx="80" cy="190" r="1.6" fill="#00D9FF"/>
    <circle cx="950" cy="110" r="1.6" fill="#8B5CF6"/>
  </g>

  <circle cx="500" cy="112" r="3" fill="#00D9FF" opacity="0.85">
    <animateMotion dur="8s" repeatCount="indefinite"
      path="M 0,0 C 200,-50 350,50 480,-10 C 600,-50 700,40 480,10 Z"/>
  </circle>

  <text x="95" y="132" font-family="Fira Code, Consolas, monospace" font-size="50" fill="#00D9FF" opacity="0.25">&lt;</text>
  <text x="870" y="132" font-family="Fira Code, Consolas, monospace" font-size="50" fill="#8B5CF6" opacity="0.25">/&gt;</text>

  <text x="50%" y="42%" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="38" font-weight="bold" fill="#00D9FF">
    ISEET Child Theme
    <animate attributeName="fill" values="#00D9FF;#8B5CF6;#00D9FF" dur="5s" repeatCount="indefinite"/>
  </text>

  <rect x="500" y="112" width="0" height="3" rx="1.5" fill="url(#accentW)">
    <animate attributeName="width" values="0;220;220" dur="1.6s" fill="freeze"/>
    <animate attributeName="x" values="500;390;390" dur="1.6s" fill="freeze"/>
  </rect>

  <text x="50%" y="70%" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="17" fill="#8B949E">
    Accessible &#8226; Responsive &#8226; Core Web Vitals Optimized &#8226; REST API Powered
  </text>
</svg>
