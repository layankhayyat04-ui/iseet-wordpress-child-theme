<svg width="1000" height="220" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117">
        <animate attributeName="stop-color" values="#0D1117;#152238;#0D1117" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#1B2A45">
        <animate attributeName="stop-color" values="#1B2A45;#2A1F4A;#1B2A45" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0D1117">
        <animate attributeName="stop-color" values="#0D1117;#152238;#0D1117" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#21759B"/>
      <stop offset="50%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="220" fill="url(#bg)"/>

  <g opacity="0.15">
    <circle cx="60" cy="40" r="1.5" fill="#00D9FF"/>
    <circle cx="120" cy="80" r="1.5" fill="#8B5CF6"/>
    <circle cx="900" cy="50" r="1.5" fill="#00D9FF"/>
    <circle cx="940" cy="180" r="1.5" fill="#8B5CF6"/>
    <circle cx="80" cy="190" r="1.5" fill="#00D9FF"/>
    <circle cx="950" cy="110" r="1.5" fill="#8B5CF6"/>
  </g>

  <circle cx="500" cy="110" r="3" fill="#00D9FF" opacity="0.8">
    <animateMotion dur="8s" repeatCount="indefinite"
      path="M 0,0 C 200,-50 350,50 480,-10 C 600,-50 700,40 480,10 Z"/>
  </circle>

  <text x="90" y="130" font-family="Fira Code, monospace" font-size="52" fill="#00D9FF" opacity="0.22">&lt;</text>
  <text x="875" y="130" font-family="Fira Code, monospace" font-size="52" fill="#8B5CF6" opacity="0.22">/&gt;</text>

  <text x="50%" y="42%" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="38" font-weight="bold"
        fill="url(#textGrad)" filter="url(#glow)">
    ISEET Child Theme
    <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite"/>
  </text>

  <rect x="500" y="112" width="220" height="3" rx="1.5" fill="url(#textGrad)">
    <animate attributeName="width" values="0;220;220" dur="1.6s"/>
    <animate attributeName="x" values="500;390;390" dur="1.6s"/>
  </rect>

  <text x="50%" y="70%" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="17" fill="#8B949E">
    Accessible &#8226; Responsive &#8226; Core Web Vitals Optimized &#8226; REST API Powered
  </text>
</svg>
